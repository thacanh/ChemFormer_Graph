name: chemformer
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.7.11
  - pip
  - pip:
    - torch==1.8.1
    - pytorch-lightning==1.2.3
    - hydra-core==1.3.2
    - omegaconf==2.3.0
    - numpy==1.21.6
    - pandas==1.3.5
    - pysmilesutils==1.1.0
    - tensorboard==2.11.2
    - -e .

# Setup:
#   conda env create -f env-dev.yml
#   conda activate chemformer
#
# GPU: cai torch CUDA rieng sau khi tao env:
#   pip install torch==1.8.1+cu111 -f https://download.pytorch.org/whl/torch_stable.html
